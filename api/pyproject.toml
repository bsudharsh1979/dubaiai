[project]
name = "rainready-api"
version = "0.1.0"
description = "RainReady UAE - Sovereign Water & HSE Command (API + worker)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.6",
    "alembic==1.20.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "langgraph==1.2.17",
    "langgraph-checkpoint-sqlite==3.1.2",
    "langgraph-checkpoint-postgres==3.2.0",
    "psycopg[binary]==3.3.6",
    "httpx==0.28.1",
    "itsdangerous==2.2.0",
    "python-multipart==0.0.32",
    "numpy>=2.2,<3",
    "rasterio>=1.4.3,<2",
    "shapely>=2.1,<3",
    "pyproj>=3.7,<4",
    "sse-starlette>=2.2,<3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-timeout>=2.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
timeout = 120

[tool.uv]
package = false
